<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d442"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Gold ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <!-- Football (soccer ball) -->
  <circle cx="256" cy="230" r="120" fill="url(#ball)" stroke="#333" stroke-width="3"/>
  <!-- Pentagon patches on ball -->
  <polygon points="256,150 280,170 272,198 240,198 232,170" fill="#1a1a2e"/>
  <polygon points="310,210 330,238 318,265 295,258 290,230" fill="#1a1a2e"/>
  <polygon points="202,210 222,230 217,258 194,265 182,238" fill="#1a1a2e"/>
  <polygon points="225,290 256,305 287,290 280,320 232,320" fill="#1a1a2e"/>
  <!-- Seam lines -->
  <line x1="256" y1="150" x2="256" y2="130" stroke="#555" stroke-width="2"/>
  <line x1="280" y1="170" x2="305" y2="158" stroke="#555" stroke-width="2"/>
  <line x1="232" y1="170" x2="207" y2="158" stroke="#555" stroke-width="2"/>
  <line x1="330" y1="238" x2="350" y2="245" stroke="#555" stroke-width="2"/>
  <line x1="182" y1="238" x2="162" y2="245" stroke="#555" stroke-width="2"/>
  <line x1="318" y1="265" x2="330" y2="288" stroke="#555" stroke-width="2"/>
  <line x1="194" y1="265" x2="182" y2="288" stroke="#555" stroke-width="2"/>
  <line x1="280" y1="320" x2="290" y2="342" stroke="#555" stroke-width="2"/>
  <line x1="232" y1="320" x2="222" y2="342" stroke="#555" stroke-width="2"/>
  <!-- Trophy cup below ball -->
  <path d="M230,370 L225,405 L215,410 L215,418 L297,418 L297,410 L287,405 L282,370" fill="url(#gold)" stroke="#b8860b" stroke-width="2"/>
  <rect x="235" y="418" width="42" height="6" rx="2" fill="url(#gold)" stroke="#b8860b" stroke-width="1"/>
  <rect x="228" y="424" width="56" height="8" rx="3" fill="url(#gold)" stroke="#b8860b" stroke-width="1"/>
  <!-- 2026 text -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="30" fill="#f5d442" letter-spacing="6">2026</text>
</svg>
